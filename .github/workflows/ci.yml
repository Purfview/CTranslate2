name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - master

jobs:
  build-python-wheels:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache MKL and oneDNN (Windows)
        uses: actions/cache@v4
        with:
          path: |
            C:/Program Files (x86)/Intel/oneAPI
            C:/Program Files (x86)/oneDNN
          key: windows-mkl-onednn-${{ hashFiles('python/tools/prepare_build_environment_windows.sh') }}

      - name: Build Python 3.10 x64 wheel
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: python
          output-dir: python/wheelhouse
        env:
          CIBW_ENVIRONMENT_WINDOWS: CTRANSLATE2_ROOT='${{ github.workspace }}\install'
          CIBW_BEFORE_ALL_WINDOWS: bash python/tools/prepare_build_environment_windows.sh
          CIBW_BEFORE_BUILD: pip install -r python/install_requirements.txt
          CIBW_BUILD: cp310-win_amd64
          CIBW_ARCHS: auto64

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-Windows-auto64
          path: python/wheelhouse/*.whl
          if-no-files-found: error
